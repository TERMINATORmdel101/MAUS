# Analyse de sécurité du code C# par CodeQL, l'analyseur de GitHub (gratuit pour un dépôt public) : injections de commandes,
# chemins et données non vérifiés, usages dangereux de l'API .NET. Les alertes s'affichent dans l'onglet « Security » du
# dépôt (Code scanning). Demande du porteur du 27/10/2026 (directives de sécurité, analyseur statique).
name: CodeQL

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
  pull_request:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    # Image fixe, et non « windows-latest » : GitHub peut changer celle-ci sans prévenir (équivalent aujourd'hui).
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Code du dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: SDK .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Préparation de CodeQL (C#, règles de sécurité étendues)
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended

      - name: Compilation observée par CodeQL
        shell: pwsh
        run: dotnet build Maus.slnx -c Release --disable-build-servers

      - name: Analyse
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: '/language:csharp'
